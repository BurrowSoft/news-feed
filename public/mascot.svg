<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="InsightMole mascot">
  <g id="mole-base" fill="white" stroke="#1e2d3d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Crown puffs -->
    <circle cx="91" cy="28" r="5" stroke-width="2.5"/>
    <circle cx="100" cy="22" r="6" stroke-width="2.5"/>
    <circle cx="109" cy="28" r="5" stroke-width="2.5"/>
    <!-- Head -->
    <circle cx="100" cy="83" r="57" stroke-width="3.5"/>
    <!-- Left lens -->
    <circle cx="81" cy="89" r="19" stroke-width="4"/>
    <!-- Right lens -->
    <circle cx="119" cy="89" r="19" stroke-width="4"/>
    <!-- Bridge -->
    <line x1="100" y1="87" x2="100" y2="92" stroke-width="3"/>
    <!-- Temple arms -->
    <line x1="62" y1="89" x2="55" y2="89" stroke-width="3"/>
    <line x1="138" y1="89" x2="145" y2="89" stroke-width="3"/>
    <!-- Left pupil -->
    <circle cx="81" cy="89" r="9" fill="#1e2d3d" stroke="none"/>
    <circle cx="84" cy="86" r="3.5" fill="white" stroke="none"/>
    <!-- Right pupil -->
    <circle cx="119" cy="89" r="9" fill="#1e2d3d" stroke="none"/>
    <circle cx="122" cy="86" r="3.5" fill="white" stroke="none"/>
    <!-- Ledge (behind newspaper) -->
    <rect x="20" y="130" width="160" height="18" rx="7" stroke-width="3.5"/>
    <!-- Left paw -->
    <ellipse cx="38" cy="124" rx="16" ry="10" stroke-width="3"/>
    <!-- Right paw -->
    <ellipse cx="162" cy="124" rx="16" ry="10" stroke-width="3"/>
  </g>

  <g id="prop" fill="white" stroke="#1e2d3d" stroke-linecap="round" stroke-linejoin="round">
    <!-- Opened newspaper held up, partially covering lower face -->
    <!-- Left page -->
    <rect x="22" y="109" width="74" height="42" rx="3" stroke-width="2.5"/>
    <!-- Right page -->
    <rect x="104" y="109" width="74" height="42" rx="3" stroke-width="2.5"/>
    <!-- Center fold -->
    <line x1="100" y1="109" x2="100" y2="151" stroke-width="2" stroke-dasharray="none"/>
    <!-- Left page — headline bar -->
    <rect x="27" y="114" width="64" height="7" rx="1" fill="#1e2d3d" stroke="none"/>
    <!-- Left page — text lines -->
    <line x1="27" y1="126" x2="91" y2="126" stroke-width="1.5" opacity="0.5"/>
    <line x1="27" y1="132" x2="91" y2="132" stroke-width="1.5" opacity="0.5"/>
    <line x1="27" y1="138" x2="91" y2="138" stroke-width="1.5" opacity="0.5"/>
    <line x1="27" y1="144" x2="75" y2="144" stroke-width="1.5" opacity="0.5"/>
    <!-- Right page — headline bar -->
    <rect x="109" y="114" width="64" height="7" rx="1" fill="#1e2d3d" stroke="none"/>
    <!-- Right page — text lines -->
    <line x1="109" y1="126" x2="173" y2="126" stroke-width="1.5" opacity="0.5"/>
    <line x1="109" y1="132" x2="173" y2="132" stroke-width="1.5" opacity="0.5"/>
    <line x1="109" y1="138" x2="173" y2="138" stroke-width="1.5" opacity="0.5"/>
    <line x1="109" y1="144" x2="157" y2="144" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>
